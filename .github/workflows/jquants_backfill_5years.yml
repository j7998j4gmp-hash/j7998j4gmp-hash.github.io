
name: J-Quants 5-Year Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2021, 2022, 2023, 2024, 2025, 2026]
        data_kind: [stocks, financials]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download historical data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DATA_KIND: ${{ matrix.data_kind }}
          TARGET_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import os
          import sys
          import calendar
          import subprocess
          from datetime import date

          year = int(os.environ["TARGET_YEAR"])
          kind = os.environ["DATA_KIND"]

          overall_start = date(2021, 11, 24)
          overall_end = date(2026, 11, 24)

          failed = []

          for month in range(1, 13):
              first = date(year, month, 1)
              last = date(
                  year,
                  month,
                  calendar.monthrange(year, month)[1]
              )

              start = max(first, overall_start)
              end = min(last, overall_end)

              if start > end:
                  continue

              env = os.environ.copy()
              env["START_DATE"] = start.isoformat()
              env["END_DATE"] = end.isoformat()

              print(
                  f"Downloading {kind}: {start} to {end}",
                  flush=True
              )

              result = subprocess.run(
                  [sys.executable, "backfill_jquants.py"],
                  env=env,
                  check=False,
              )

              if result.returncode != 0:
                  failed.append(f"{start} to {end}")

          if failed:
              print("Failed periods:", failed)
              sys.exit(1)

          print(f"Completed: {kind} {year}")
          PY
